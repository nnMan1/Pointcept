services:
  pointcept:
    image: "pointcept:scannet" 
    tty: true
    stdin_open: true
    build: 
      context: .
      dockerfile: Dockerfile
    environment:
      DISPLAY: $DISPLAY
    network_mode: "host"
    volumes:
      - .:/home
      - /tmp/.X11-unix:/tmp\.X11-unix
      - ${DATA_PATH}:/home/data
    deploy:
      resources:
        limits:
          memory: 13G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
